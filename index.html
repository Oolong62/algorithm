<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뮤지컬 다중 도장판 순환 최적화 탐색기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 sm:p-6">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            // 관극 기록 상태 (localStorage 연동)
            const [records, setRecords] = React.useState(() => {
                const saved = localStorage.getItem('multi_board_records');
                return saved ? JSON.parse(saved) : [
                    { id: 1, date: '2026-03-01', title: '이끼숲', isDouble: false },
                    { id: 2, date: '2026-03-10', title: '이끼숲', isDouble: true },
                    { id: 3, date: '2026-03-15', title: '이끼숲', isDouble: false },
                    { id: 4, date: '2026-03-20', title: '이끼숲', isDouble: false },
                    { id: 5, date: '2026-04-01', title: '이끼숲', isDouble: false },
                    { id: 6, date: '2026-04-05', title: '이끼숲', isDouble: false },
                    { id: 7, date: '2026-04-10', title: '이끼숲', isDouble: false },
                    { id: 8, date: '2026-04-15', title: '이끼숲', isDouble: false },
                    { id: 9, date: '2026-04-20', title: '이끼숲', isDouble: false }, // 2판으로 넘어가는 관극
                    { id: 10, date: '2026-05-01', title: '이끼숲', isDouble: false }
                ];
            });

            // 입력 폼 상태
            const [form, setForm] = React.useState({
                date: new Date().toISOString().split('T')[0],
                title: '이끼숲',
                isDouble: false
            });

            // 우선 목표 혜택 선택 (도장판 1판 기준 4개, 6개, 8개 중 선택)
            const [selectedPriority, setSelectedPriority] = React.useState(4);

            // 로컬 스토리지 저장
            React.useEffect(() => {
                localStorage.setItem('multi_board_records', JSON.stringify(records));
            }, [records]);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!form.title.trim()) return;
                const newRecord = { id: Date.now(), ...form };
                setRecords([newRecord, ...records]);
                setForm({
                    date: new Date().toISOString().split('T')[0],
                    title: form.title,
                    isDouble: false
                });
            };

            const handleDelete = (id) => {
                setRecords(records.filter(r => r.id !== id));
            };

            // 작품 목록
            const shows = [...new Set(records.map(r => r.title))];
            const [activeShow, setActiveShow] = React.useState('이끼숲');
            
            if (!shows.includes(activeShow) && shows.length > 0) {
                setActiveShow(shows[0]);
            }

            // 선택된 작품의 관극 기록 필터링 및 날짜순 정렬 (과거 -> 최신)
            const showRecords = records
                .filter(r => r.title === activeShow)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            // ── [다중 도장판 순환 시뮬레이션 알고리즘] ──
            // 도장판 1판당 최대 8개 도장. 9개째부터는 2판으로 자동 이월됨.
            const BOARD_CAPACITY = 8;
            let totalCumulativeStamps = 0;
            let boardTimeline = [];

            // 도장판별 상태 집계
            let boards = {};

            showRecords.forEach((record, index) => {
                const earned = record.isDouble ? 2 : 1;
                
                // 이번 관람으로 얻은 도장들을 하나씩 순회하며 어느 판에 들어가는지 시뮬레이션
                for (let i = 0; i < earned; i++) {
                    totalCumulativeStamps += 1;
                    const currentBoardNum = Math.ceil(totalCumulativeStamps / BOARD_CAPACITY);
                    const positionInBoard = ((totalCumulativeStamps - 1) % BOARD_CAPACITY) + 1;

                    if (!boards[currentBoardNum]) {
                        boards[currentBoardNum] = { boardNum: currentBoardNum, stampsCount: 0, milestones: { 4: null, 6: null, 8: null } };
                    }
                    boards[currentBoardNum].stampsCount += 1;

                    // 각 판의 4, 6, 8 도장 도달 시점 기록
                    if ([4, 6, 8].includes(positionInBoard) && !boards[currentBoardNum].milestones[positionInBoard]) {
                        boards[currentBoardNum].milestones[positionInBoard] = {
                            date: record.date,
                            recordIndex: index + 1
                        };
                    }
                }

                boardTimeline.push({
                    index: index + 1,
                    date: record.date,
                    earned: earned,
                    isDouble: record.isDouble,
                    totalCumulative: totalCumulativeStamps,
                    currentBoard: Math.ceil(totalCumulativeStamps / BOARD_CAPACITY),
                    positionInCurrentBoard: ((totalCumulativeStamps - 1) % BOARD_CAPACITY) + 1
                });
            });

            // 현재 진행 중인 마지막 도장판 번호 및 진행 상황 계산
            const currentActiveBoardNum = totalCumulativeStamps === 0 ? 1 : Math.ceil(totalCumulativeStamps / BOARD_CAPACITY);
            const currentBoardPosition = totalCumulativeStamps === 0 ? 0 : ((totalCumulativeStamps - 1) % BOARD_CAPACITY) + 1;
            const activeBoardData = boards[currentActiveBoardNum] || { boardNum: currentActiveBoardNum, stampsCount: 0, milestones: { 4: null, 6: null, 8: null } };

            // 최적화 가이드 분석 (현재 판 기준)
            const targetMilestoneInfo = activeBoardData.milestones[selectedPriority];
            let optimizationAdvice = "";

            if (targetMilestoneInfo) {
                optimizationAdvice = `✨ 현재 [제${currentActiveBoardNum}판]에서 **${selectedPriority}개 혜택**은 이미 ${targetMilestoneInfo.date} 관람 때 달성 완료되었습니다!`;
            } else {
                const neededStamps = selectedPriority - currentBoardPosition;
                if (neededStamps > 0) {
                    optimizationAdvice = `🎯 현재 [제${currentActiveBoardNum}판] 진행 중 (현재 ${currentBoardPosition}/8개). 선택하신 **${selectedPriority}개 혜택**까지 **도장 ${neededStamps개}가 더 필요**합니다.`;
                } else {
                    optimizationAdvice = `🚀 현재 [제${currentActiveBoardNum}판]에서 이미 ${selectedPriority}개 단계를 넘어 다음 단계로 향하고 있습니다!`;
                }
            }

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <header className="text-center">
                        <h1 className="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">🎭 다중 도장판 순환 최적화 탐색기</h1>
                        <p className="text-slate-500 mt-1 text-sm">8개 만원 도장판이 여러 개일 때, 판을 넘나들며 혜택 도달 시점을 자동으로 시뮬레이션합니다.</p>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {/* [왼쪽] 입력 및 설정 */}
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 md:col-span-1 space-y-5">
                            <div>
                                <h2 className="text-md font-semibold mb-3 text-slate-700">⚙️ 우선 탐색할 혜택 (판 기준)</h2>
                                <div className="grid grid-cols-3 gap-2">
                                    {[4, 6, 8].map(m => (
                                        <button
                                            key={m}
                                            type="button"
                                            onClick={() => setSelectedPriority(m)}
                                            className={`py-2 text-sm font-semibold rounded-xl border transition ${
                                                selectedPriority === m 
                                                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' 
                                                    : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                                            }`}
                                        >
                                            {m}개 혜택
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <hr className="border-slate-100" />

                            <div>
                                <h2 className="text-md font-semibold mb-3 text-slate-700">➕ 관극 기록 추가</h2>
                                <form onSubmit={handleSubmit} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">관람일자</label>
                                        <input 
                                            type="date" 
                                            value={form.date}
                                            onChange={e => setForm({...form, date: e.target.value})}
                                            className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm"
                                            required 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">뮤지컬 작품명</label>
                                        <input 
                                            type="text" 
                                            placeholder="예: 이끼숲"
                                            value={form.title}
                                            onChange={e => setForm({...form, title: e.target.value})}
                                            className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm"
                                            required 
                                        />
                                    </div>
                                    <div className="flex items-center gap-2 pt-1">
                                        <input 
                                            type="checkbox" 
                                            id="isDouble"
                                            checked={form.isDouble}
                                            onChange={e => setForm({...form, isDouble: e.target.checked})}
                                            className="w-4 h-4 text-indigo-600 rounded border-slate-300"
                                        />
                                        <label htmlFor="isDouble" className="text-xs text-slate-700 cursor-pointer">더블 적립 회차 (도장 2개)</label>
                                    </div>
                                    <button type="submit" className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition">
                                        기록 추가 및 판별 자동 계산
                                    </button>
                                </form>
                            </div>
                        </div>

                        {/* [오른쪽] 도장판 현황 및 탐색 결과 */}
                        <div className="md:col-span-2 space-y-6">
                            {/* 최적화 안내 가이드 */}
                            <div className="bg-indigo-50 border border-indigo-100 p-5 rounded-2xl space-y-2">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-sm font-bold text-indigo-900 uppercase tracking-wider">💡 다중 도장판 스마트 탐색 결과</h3>
                                    {shows.length > 0 && (
                                        <select 
                                            value={activeShow} 
                                            onChange={e => setActiveShow(e.target.value)}
                                            className="p-1 bg-white border border-indigo-200 rounded-lg text-xs font-medium text-indigo-800"
                                        >
                                            {shows.map(show => <option key={show} value={show}>{show}</option>)}
                                        </select>
                                    )}
                                </div>
                                <p className="text-sm text-indigo-950 font-medium leading-relaxed pt-1">
                                    {optimizationAdvice}
                                </p>
                            </div>

                            {/* 현재 진행 중인 도장판 시각화 (8칸 기준) */}
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-md font-semibold text-slate-700">🎟️ 현재 진행 중인 도장판 (제 {currentActiveBoardNum}판)</h3>
                                    <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">
                                        총 누적 도장: {totalCumulativeStamps}개
                                    </span>
                                </div>

                                {/* 1~8칸 그리드 */}
                                <div className="grid grid-cols-4 sm:grid-cols-8 gap-2">
                                    {Array.from({ length: BOARD_CAPACITY }).map((_, idx) => {
                                        const slotNum = idx + 1;
                                        const isStamped = slotNum <= currentBoardPosition;
                                        const isMilestone = [4, 6, 8].includes(slotNum);
                                        return (
                                            <div 
                                                key={idx}
                                                className={`aspect-square rounded-xl flex flex-col items-center justify-center text-xs font-bold transition-all relative ${
                                                    isStamped 
                                                        ? 'bg-indigo-600 text-white shadow-sm' 
                                                        : 'bg-slate-100 text-slate-300 border border-dashed border-slate-200'
                                                }`}
                                            >
                                                <span>{slotNum}</span>
                                                {isMilestone && (
                                                    <span className={`text-[9px] mt-0.5 px-1 rounded ${isStamped ? 'bg-indigo-500 text-white' : 'bg-slate-200 text-slate-500'}`}>
                                                        {slotNum}개특전
                                                    </span>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* 모든 도장판별 혜택 달성 이력 요약 */}
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                                <h3 className="text-md font-semibold text-slate-700">📋 도장판별 혜택 달성 기록</h3>
                                <div className="space-y-2">
                                    {Object.values(boards).map(b => (
                                        <div key={b.boardNum} className="p-3 bg-slate-50 rounded-xl border border-slate-100 text-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                            <div className="font-bold text-slate-800">
                                                제 {b.boardNum}판 <span className="text-xs text-slate-400 font-normal ml-1">(채워진 도장: {b.stampsCount}/8개)</span>
                                            </div>
                                            <div className="flex gap-2 text-xs">
                                                {[4, 6, 8].map(m => {
                                                    const achievedInfo = b.milestones[m];
                                                    return (
                                                        <span key={m} className={`px-2 py-1 rounded-lg font-medium ${achievedInfo ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-400'}`}>
                                                            {m}개: {achievedInfo ? `${achievedInfo.date}` : '미달성'}
                                                        </span>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* 관극 기록 리스트 */}
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                <h3 className="text-md font-semibold mb-4 text-slate-700">📜 전체 관극 회차 타임라인</h3>
                                {showRecords.length === 0 ? (
                                    <p className="text-sm text-slate-400 text-center py-4">관극 기록이 없습니다.</p>
                                ) : (
                                    <div className="space-y-2 max-h-52 overflow-y-auto pr-1">
                                        {boardTimeline.map(item => (
                                            <div key={item.index} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-sm border border-slate-100">
                                                <div className="flex items-center gap-3">
                                                    <span className="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center">
                                                        {item.index}
                                                    </span>
                                                    <div>
                                                        <span className="font-bold text-slate-800">{item.date} 관람</span>
                                                        {item.isDouble && <span className="ml-2 bg-amber-100 text-amber-700 text-[10px] px-1.5 py-0.5 rounded font-semibold">더블적립(+2)</span>}
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <span className="text-xs font-medium text-slate-500">
                                                        [제 {item.currentBoard}판 - {item.positionInCurrentBoard}번째]
                                                    </span>
                                                    <button onClick={() => handleDelete(showRecords[item.index - 1].id)} className="text-slate-400 hover:text-rose-500 text-xs px-2 py-1">
                                                        삭제
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
