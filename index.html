<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뮤지컬 관극 도장판 혜택 최적화 탐색기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 sm:p-6">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            // 관극 기록 상태 (localStorage 연동)
            const [records, setRecords] = React.useState(() => {
                const saved = localStorage.getItem('optimized_stamp_records');
                return saved ? JSON.parse(saved) : [
                    { id: 1, date: '2026-05-01', title: '이끼숲', isDouble: false },
                    { id: 2, date: '2026-05-05', title: '이끼숲', isDouble: true },
                    { id: 3, date: '2026-05-10', title: '이끼숲', isDouble: false },
                    { id: 4, date: '2026-05-15', title: '이끼숲', isDouble: false }
                ];
            });

            // 입력 폼 상태
            const [form, setForm] = React.useState({
                date: new Date().toISOString().split('T')[0],
                title: '이끼숲',
                isDouble: false
            });

            // 사용자가 선택한 우선 목표 혜택 (4개, 6개, 8개 중 선택)
            const [selectedPriority, setSelectedPriority] = React.useState(4);

            // 로컬 스토리지 저장
            React.useEffect(() => {
                localStorage.setItem('optimized_stamp_records', JSON.stringify(records));
            }, [records]);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!form.title.trim()) return;
                const newRecord = { id: Date.now(), ...form };
                setRecords([newRecord, ...records]);
                setForm({
                    date: new Date().toISOString().split('T')[0],
                    title: form.title,
                    isDouble: false
                });
            };

            const handleDelete = (id) => {
                setRecords(records.filter(r => r.id !== id));
            };

            // 작품 목록
            const shows = [...new Set(records.map(r => r.title))];
            const [activeShow, setActiveShow] = React.useState('이끼숲');
            
            if (!shows.includes(activeShow) && shows.length > 0) {
                setActiveShow(shows[0]);
            }

            // 선택된 작품의 관극 기록 필터링 및 날짜순 정렬 (과거 -> 최신)
            const showRecords = records
                .filter(r => r.title === activeShow)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            // ── [최적화 루트 탐색 알고리즘] ──
            // 관극 기록(회차별 도장 1개 또는 2개)을 순서대로 쌓아가며 
            // 4개, 6개, 8개 도장판 혜택을 어떤 관극 회차에 달성하는지 시뮬레이션합니다.
            const standardMilestones = [4, 6, 8];
            let cumulativeStamps = 0;
            let timelineSimulation = [];
            
            // 각 혜택별 달성 여부 및 시점 기록
            let milestoneStatus = {
                4: { achieved: false, achievedAtDate: null, stampsAtAchievement: 0 },
                6: { achieved: false, achievedAtDate: null, stampsAtAchievement: 0 },
                8: { achieved: false, achievedAtDate: null, stampsAtAchievement: 0 }
            };

            showRecords.forEach((record, index) => {
                const earned = record.isDouble ? 2 : 1;
                const prevStamps = cumulativeStamps;
                cumulativeStamps += earned;

                // 이번 관람으로 마일스톤을 넘어섰는지 확인
                standardMilestones.forEach(m => {
                    if (!milestoneStatus[m].achieved && cumulativeStamps >= m) {
                        milestoneStatus[m].achieved = true;
                        milestoneStatus[m].achievedAtDate = record.date;
                        milestoneStatus[m].stampsAtAchievement = cumulativeStamps;
                    }
                });

                timelineSimulation.push({
                    index: index + 1,
                    date: record.date,
                    earned: earned,
                    isDouble: record.isDouble,
                    totalAfter: cumulativeStamps
                });
            });

            // 사용자가 선택한 우선순위 혜택 기준 최적화 가이드 분석
            const targetMilestoneData = milestoneStatus[selectedPriority];
            let optimizationAdvice = "";

            if (targetMilestoneData.achieved) {
                optimizationAdvice = `🎉 선택하신 [${selectedPriority}개 혜택]은 ${targetMilestoneData.achievedAtDate} 관람 (누적 도장 ${targetMilestoneData.stampsAtAchievement}개) 시점에 이미 달성 완료되었습니다!`;
            } else {
                const neededStamps = selectedPriority - cumulativeStamps;
                optimizationAdvice = `⏳ 선택하신 [${selectedPriority}개 혜택] 달성까지 현재 누적 도장 ${cumulativeStamps}개로, **앞으로 도장 ${neededStamps}개가 더 필요**합니다. (다음 관람 시 더블 적립 회차를 활용하면 더 빠르게 달성할 수 있습니다!)`;
            }

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <header className="text-center">
                        <h1 className="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">🎯 관극 도장판 혜택 최적화 탐색기</h1>
                        <p className="text-slate-500 mt-1 text-sm">목표 혜택을 먼저 설정하고, 내 관극 기록에 따른 최적의 적립 순서와 달성 시점을 시뮬레이션하세요.</p>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {/* [왼쪽] 기록 입력 및 목표 설정 */}
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 md:col-span-1 space-y-5">
                            <div>
                                <h2 className="text-md font-semibold mb-3 text-slate-700">⚙️ 우선 목표 혜택 선택</h2>
                                <div className="grid grid-cols-3 gap-2">
                                    {[4, 6, 8].map(m => (
                                        <button
                                            key={m}
                                            type="button"
                                            onClick={() => setSelectedPriority(m)}
                                            className={`py-2 text-sm font-semibold rounded-xl border transition ${
                                                selectedPriority === m 
                                                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' 
                                                    : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                                            }`}
                                        >
                                            {m}개 혜택
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <hr className="border-slate-100" />

                            <div>
                                <h2 className="text-md font-semibold mb-3 text-slate-700">➕ 관극 기록 추가</h2>
                                <form onSubmit={handleSubmit} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">관람일자</label>
                                        <input 
                                            type="date" 
                                            value={form.date}
                                            onChange={e => setForm({...form, date: e.target.value})}
                                            className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm"
                                            required 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-500 mb-1">뮤지컬 작품명</label>
                                        <input 
                                            type="text" 
                                            placeholder="예: 이끼숲"
                                            value={form.title}
                                            onChange={e => setForm({...form, title: e.target.value})}
                                            className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm"
                                            required 
                                        />
                                    </div>
                                    <div className="flex items-center gap-2 pt-1">
                                        <input 
                                            type="checkbox" 
                                            id="isDouble"
                                            checked={form.isDouble}
                                            onChange={e => setForm({...form, isDouble: e.target.checked})}
                                            className="w-4 h-4 text-indigo-600 rounded border-slate-300"
                                        />
                                        <label htmlFor="isDouble" className="text-xs text-slate-700 cursor-pointer">더블 적립 회차 (도장 2개)</label>
                                    </div>
                                    <button type="submit" className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition">
                                        기록 추가 및 최적화 재탐색
                                    </button>
                                </form>
                            </div>
                        </div>

                        {/* [오른쪽] 최적화 탐색 결과 및 시뮬레이션 대시보드 */}
                        <div className="md:col-span-2 space-y-6">
                            {/* 최적화 가이드 패널 */}
                            <div className="bg-indigo-50 border border-indigo-100 p-5 rounded-2xl space-y-2">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-sm font-bold text-indigo-900 uppercase tracking-wider">💡 스마트 최적화 분석 결과</h3>
                                    {shows.length > 0 && (
                                        <select 
                                            value={activeShow} 
                                            onChange={e => setActiveShow(e.target.value)}
                                            className="p-1 bg-white border border-indigo-200 rounded-lg text-xs font-medium text-indigo-800"
                                        >
                                            {shows.map(show => <option key={show} value={show}>{show}</option>)}
                                        </select>
                                    )}
                                </div>
                                <p className="text-sm text-indigo-950 font-medium leading-relaxed pt-1">
                                    {optimizationAdvice}
                                </p>
                            </div>

                            {/* 4개, 6개, 8개 마일스톤 달성 요약 카드 */}
                            <div className="grid grid-cols-3 gap-3">
                                {[4, 6, 8].map(m => {
                                    const status = milestoneStatus[m];
                                    const isSelected = selectedPriority === m;
                                    return (
                                        <div key={m} className={`p-4 rounded-xl border text-center transition ${isSelected ? 'border-indigo-500 bg-indigo-50/40 shadow-sm' : 'border-slate-100 bg-white'}`}>
                                            <span className="text-xs font-bold text-slate-400 block mb-1">{m}개 도장 혜택</span>
                                            <span className={`text-sm font-bold ${status.achieved ? 'text-emerald-600' : 'text-slate-400'}`}>
                                                {status.achieved ? '달성 완료 ✨' : '미달성'}
                                            </span>
                                            {status.achieved && (
                                                <p className="text-[11px] text-slate-500 mt-1">{status.achievedAtDate} 달성</p>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>

                            {/* 관극 회차별 도장 적립 타임라인 시뮬레이션 */}
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                <h3 className="text-md font-semibold mb-4 text-slate-700">📈 회차별 적립 순서 및 타임라인 시뮬레이션</h3>
                                {showRecords.length === 0 ? (
                                    <p className="text-sm text-slate-400 text-center py-4">관극 기록이 없습니다.</p>
                                ) : (
                                    <div className="space-y-2.5 max-h-60 overflow-y-auto pr-1">
                                        {timelineSimulation.map(item => (
                                            <div key={item.index} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-sm border border-slate-100">
                                                <div className="flex items-center gap-3">
                                                    <span className="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center">
                                                        {item.index}
                                                    </span>
                                                    <div>
                                                        <span className="font-bold text-slate-800">{item.date} 관람</span>
                                                        {item.isDouble && <span className="ml-2 bg-amber-100 text-amber-700 text-[10px] px-1.5 py-0.5 rounded font-semibold">더블적립(+2)</span>}
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <span className="text-xs font-medium text-slate-500">누적 도장: <strong className="text-indigo-600">{item.totalAfter}개</strong></span>
                                                    <button onClick={() => handleDelete(showRecords[item.index - 1].id)} className="text-slate-400 hover:text-rose-500 text-xs px-2 py-1">
                                                        삭제
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
