<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뮤지컬 관극 도장판 최적화 탐색기</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 sm:p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="text-center">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">🧭 관극 도장판 최적 배분 & 최적화 탐색기</h1>
            <p class="text-slate-500 mt-1 text-sm">기록을 먼저 쌓은 뒤, 원할 때 최적화를 실행하여 8칸 판에서 기준 개수(4개/6개) 단위로 끊어 넘어가는 시뮬레이션입니다.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- [왼쪽] 설정 및 기록 입력 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 md:col-span-1 space-y-5">
                <div>
                    <h2 class="text-md font-semibold mb-3 text-slate-700">⚙️ 도장판 최적화 설정</h2>
                    <div class="space-y-3 text-sm">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">판 완성 기준 도장 수 (목표 혜택)</label>
                            <select id="target-criteria" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg">
                                <option value="4">4개 기준 도달 시 판 넘김 (8칸 판 중 4개만 채움)</option>
                                <option value="6">6개 기준 도달 시 판 넘김 (8칸 판 중 6개만 채움)</option>
                                <option value="8" selected>8개 기준 도달 시 판 넘김 (8칸 판 꽉 채움)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">운영할 도장판 총 개수</label>
                            <input type="number" id="board-count" value="2" min="1" max="10" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                        </div>
                        <button onclick="runOptimization()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition shadow-sm mt-2">
                            ⚡ 최적화 탐색 실행하기
                        </button>
                    </div>
                </div>

                <hr class="border-slate-100" />

                <div>
                    <h2 class="text-md font-semibold mb-3 text-slate-700">➕ 관극 기록 먼저 추가하기</h2>
                    <form onsubmit="addRecord(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">관람일자</label>
                            <input type="date" id="input-date" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm" required />
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">뮤지컬 작품명</label>
                            <input type="text" id="input-title" value="이끼숲" placeholder="예: 이끼숲" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm" required />
                        </div>
                        <div class="flex items-center gap-2 pt-1">
                            <input type="checkbox" id="input-double" class="w-4 h-4 text-indigo-600 rounded border-slate-300" />
                            <label for="input-double" class="text-xs text-slate-700 cursor-pointer">더블 적립 회차 (도장 2개)</label>
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-medium rounded-lg text-sm transition">
                            기록 누적 저장
                        </button>
                    </form>
                </div>
            </div>

            <!-- [오른쪽] 탐색 결과 및 도장판 시각화 -->
            <div class="md:col-span-2 space-y-6">
                <!-- 결과 가이드 -->
                <div class="bg-indigo-50 border border-indigo-100 p-5 rounded-2xl space-y-2">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-indigo-900 uppercase tracking-wider">💡 최적화 탐색 결과</h3>
                        <select id="show-select" onchange="render()" class="p-1 bg-white border border-indigo-200 rounded-lg text-xs font-medium text-indigo-800">
                        </select>
                    </div>
                    <p id="advice-text" class="text-sm text-indigo-950 font-medium leading-relaxed pt-1">
                        왼쪽에서 기록을 추가한 뒤 **[최적화 탐색 실행하기]** 버튼을 눌러주세요.
                    </p>
                </div>

                <!-- 8칸 고정 도장판 시각화 영역 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                    <h3 class="text-md font-semibold text-slate-700">🎟️ 8칸 도장판별 최적 배분 현황</h3>
                    <div id="boards-container" class="space-y-4">
                        <p class="text-sm text-slate-400 text-center py-4">최적화 실행 전입니다.</p>
                    </div>
                </div>

                <!-- 관극 기록 리스트 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="text-md font-semibold mb-4 text-slate-700">📜 누적된 전체 관극 기록</h3>
                    <div id="timeline-list" class="space-y-2 max-h-52 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem('manual_opt_records')) || [
            { id: 1, date: '2026-03-01', title: '이끼숲', isDouble: false },
            { id: 2, date: '2026-03-10', title: '이끼숲', isDouble: true },
            { id: 3, date: '2026-03-15', title: '이끼숲', isDouble: false },
            { id: 4, date: '2026-03-20', title: '이끼숲', isDouble: false },
            { id: 5, date: '2026-04-01', title: '이끼숲', isDouble: false }
        ];

        let optimizedResult = null; // 최적화 실행 결과 저장용

        document.getElementById('input-date').value = new Date().toISOString().split('T')[0];

        function addRecord(e) {
            e.preventDefault();
            const date = document.getElementById('input-date').value;
            const title = document.getElementById('input-title').value.trim();
            const isDouble = document.getElementById('input-double').checked;

            if (!title) return;

            const newRecord = { id: Date.now(), date, title, isDouble };
            records.unshift(newRecord);
            localStorage.setItem('manual_opt_records', JSON.stringify(records));
            render();
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            localStorage.setItem('manual_opt_records', JSON.stringify(records));
            optimizedResult = null; // 기록이 바뀌면 최적화 결과 초기화
            render();
        }

        function runOptimization() {
            const targetCriteria = parseInt(document.getElementById('target-criteria').value);
            const totalBoards = parseInt(document.getElementById('board-count').value);
            const activeShow = document.getElementById('show-select').value;

            const showRecords = records
                .filter(r => r.title === activeShow)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            let boards = {};
            for (let i = 1; i <= totalBoards; i++) {
                boards[i] = { boardNum: i, stampsCount: 0, completed: false };
            }

            let currentBoardIdx = 1;
            let totalStampsEarned = 0;

            showRecords.forEach((record) => {
                const earned = record.isDouble ? 2 : 1;
                for (let i = 0; i < earned; i++) {
                    totalStampsEarned += 1;
                    if (currentBoardIdx <= totalBoards) {
                        boards[currentBoardIdx].stampsCount += 1;
                        
                        // 사용자가 지정한 기준 개수(예: 4개)에 도달하면 해당 판 완성 후 다음 판으로 점프
                        if (boards[currentBoardIdx].stampsCount === targetCriteria) {
                            boards[currentBoardIdx].completed = true;
                            if (currentBoardIdx < totalBoards) {
                                currentBoardIdx += 1;
                            }
                        }
                    }
                }
            });

            optimizedResult = { targetCriteria, totalBoards, boards, totalStampsEarned };
            renderResults();
        }

        function render() {
            const shows = [...new Set(records.map(r => r.title))];
            const selectEl = document.getElementById('show-select');
            let activeShow = selectEl.value;

            if (shows.length === 0) {
                selectEl.innerHTML = '<option>기록 없음</option>';
            } else {
                if (!shows.includes(activeShow)) activeShow = shows[0];
                selectEl.innerHTML = shows.map(s => `<option value="${s}" ${s === activeShow ? 'selected' : ''}>${s}</option>`).join('');
            }

            // 관극 기록 리스트 렌더링
            const showRecords = records.filter(r => r.title === activeShow);
            let timelineHtml = '';
            if (showRecords.length === 0) {
                timelineHtml = '<p class="text-sm text-slate-400 text-center py-4">누적된 관극 기록이 없습니다.</p>';
            } else {
                showRecords.forEach((item, index) => {
                    timelineHtml += `
                        <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-sm border border-slate-100">
                            <div class="flex items-center gap-3">
                                <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center">${index + 1}</span>
                                <div>
                                    <span class="font-bold text-slate-800">${item.date} 관람</span>
                                    ${item.isDouble ? '<span class="ml-2 bg-amber-100 text-amber-700 text-[10px] px-1.5 py-0.5 rounded font-semibold">더블적립(+2)</span>' : ''}
                                </div>
                            </div>
                            <button onclick="deleteRecord(${item.id})" class="text-slate-400 hover:text-rose-500 text-xs px-2 py-1">삭제</button>
                        </div>
                    `;
                });
            }
            document.getElementById('timeline-list').innerHTML = timelineHtml;

            // 이미 최적화가 실행된 상태였다면 결과 화면 갱신
            if (optimizedResult) {
                renderResults();
            }
        }

        function renderResults() {
            if (!optimizedResult) return;
            const { targetCriteria, totalBoards, boards, totalStampsEarned } = optimizedResult;
            let completedCount = Object.values(boards).filter(b => b.completed).length;

            document.getElementById('advice-text').innerHTML = `
                ✨ 최적화 탐색 완료! 설정하신 [${targetCriteria}개 기준 도달 시 판 넘김] 규칙에 따라 총 ${totalBoards}개의 8칸 판 중 **${completedCount}개 판이 완성**되었습니다. (총 누적 도장: ${totalStampsEarned}개)
            `;

            let boardsHtml = '';
            for (let i = 1; i <= totalBoards; i++) {
                const b = boards[i];
                let gridHtml = '';
                
                // 도장판은 무조건 물리적으로 8칸 표시
                for (let slot = 1; slot <= 8; slot++) {
                    const isFilled = slot <= b.stampsCount;
                    const isBeyondCriteria = slot > targetCriteria; // 기준 개수를 초과하는 칸 (예: 4개 기준일 때 5~8번 칸)

                    let slotBg = '';
                    let textColor = '';
                    let label = '';

                    if (isFilled) {
                        slotBg = 'bg-indigo-600 text-white shadow-sm';
                        label = `${slot}`;
                    } else if (isBeyondCriteria) {
                        // 기준을 채우고 넘어갔기 때문에 비워두는 칸
                        slotBg = 'bg-slate-200 text-slate-400 opacity-50';
                        label = `${slot}`;
                    } else {
                        // 채워야 하지만 아직 도장이 모자란 칸
                        slotBg = 'bg-slate-50 text-slate-300 border border-dashed border-slate-200';
                        label = `${slot}`;
                    }

                    gridHtml += `
                        <div class="aspect-square rounded-xl flex flex-col items-center justify-center text-xs font-bold transition-all relative ${slotBg}">
                            <span>${label}</span>
                            ${slot === targetCriteria ? '<span class="text-[8px] bg-indigo-500 text-white px-1 rounded mt-0.5">기준점</span>' : ''}
                        </div>
                    `;
                }

                boardsHtml += `
                    <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 space-y-3">
                        <div class="flex justify-between items-center text-sm">
                            <span class="font-bold text-slate-800">제 ${b.boardNum}판 (8칸 만원 / 목표 기준: ${targetCriteria}개)</span>
                            <span class="px-2.5 py-1 rounded-lg text-xs font-medium ${b.completed ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                ${b.completed ? '기준 달성 완료 ✨' : `진행 중 (${b.stampsCount}/${targetCriteria} 채워짐)`}
                            </span>
                        </div>
                        <div class="grid grid-cols-4 sm:grid-cols-8 gap-2">
                            ${gridHtml}
                        </div>
                    </div>
                `;
            }
            document.getElementById('boards-container').innerHTML = boardsHtml;
        }

        render();
    </script>
</body>
</html>
