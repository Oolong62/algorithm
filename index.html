<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뮤지컬 관극 루트 최적화 도장 계산기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-p-4">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            // 관극 기록 상태 (localStorage 연동)
            const [records, setRecords] = React.useState(() => {
                const saved = localStorage.getItem('optimized_musical_records');
                return saved ? JSON.parse(saved) : [
                    { id: 1, date: '2026-05-01', title: '이끼숲', cast: '캐스트A', isDouble: false },
                    { id: 2, date: '2026-05-05', title: '이끼숲', cast: '캐스트B', isDouble: true },
                    { id: 3, date: '2026-05-10', title: '여신님이 보고 계셔', cast: '캐스트C', isDouble: false },
                    { id: 4, date: '2026-05-12', title: '여신님이 보고 계셔', cast: '캐스트A', isDouble: false },
                    { id: 5, date: '2026-05-15', title: '여신님이 보고 계셔', cast: '캐스트B', isDouble: true },
                ];
            });

            // 입력 폼 상태
            const [form, setForm] = React.useState({
                date: new Date().toISOString().split('T')[0],
                title: '이끼숲',
                cast: '',
                isDouble: false
            });

            // 작품별 도장판 보상 목표 설정 (예: 3개, 5개, 10개 단위 특전)
            const rewardMilestones = [3, 5, 10];

            // 로컬 스토리지 저장
            React.useEffect(() => {
                localStorage.setItem('optimized_musical_records', JSON.stringify(records));
            }, [records]);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!form.title.trim()) return;
                const newRecord = { id: Date.now(), ...form };
                setRecords([newRecord, ...records]);
                setForm({
                    date: new Date().toISOString().split('T')[0],
                    title: form.title,
                    cast: '',
                    isDouble: false
                });
            };

            const handleDelete = (id) => {
                setRecords(records.filter(r => r.id !== id));
            };

            // ── [최적화 알고리즘 분석 로직] ──
            // 작품별로 그룹화하여 총 도장 수 계산 및 다음 목표까지의 최적 루트 분석
            const analysisMap = {};
            records.forEach(r => {
                if (!analysisMap[r.title]) {
                    analysisMap[r.title] = { totalStamps: 0, count: 0, items: [] };
                }
                const earned = r.isDouble ? 2 : 1;
                analysisMap[r.title].totalStamps += earned;
                analysisMap[r.title].count += 1;
                analysisMap[r.title].items.push(r);
            });

            // 최적화 루트 도출
            const optimizedRoutes = Object.keys(analysisMap).map(title => {
                const data = analysisMap[title];
                const currentStamps = data.totalStamps;

                // 다음 달성해야 할 마일스톤 찾기
                let nextMilestone = rewardMilestones.find(m => m > currentStamps);
                let isCompletedAll = false;
                
                if (!nextMilestone) {
                    nextMilestone = rewardMilestones[rewardMilestones.length - 1];
                    isCompletedAll = true;
                }

                const stampsNeeded = isCompletedAll ? 0 : nextMilestone - currentStamps;
                
                // 효율성 점수 계산 (관람 횟수 대비 도장 획득 효율)
                const efficiency = (currentStamps / data.count).toFixed(2);

                return {
                    title,
                    totalStamps: currentStamps,
                    totalViews: data.count,
                    efficiency,
                    nextMilestone: isCompletedAll ? '모든 특전 달성 완료! 🎉' : `${nextMilestone}개 특전 (앞으로 ${stampsNeeded}개 필요)`,
                    progressPercent: Math.min(100, Math.round((currentStamps / nextMilestone) * 100))
                };
            });

            return (
                <div className="max-w-4xl mx-auto p-4 sm:p-6">
                    <header className="mb-8 text-center">
                        <h1 className="text-3xl font-bold text-slate-900 tracking-tight">🧭 관극 루트 최적화 & 도장 분석기</h1>
                        <p className="text-slate-500 mt-2">전체 관극 기록을 바탕으로 작품별 적립 효율과 다음 특전 달성 루트를 분석합니다.</p>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {/* 관극 기록 입력 */}
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 md:col-span-1">
                            <h2 className="text-lg font-semibold mb-4 text-slate-700">➕ 관극 기록 추가</h2>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-medium text-slate-500 mb-1">관람일자</label>
                                    <input 
                                        type="date" 
                                        value={form.date}
                                        onChange={e => setForm({...form, date: e.target.value})}
                                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm"
                                        required 
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-500 mb-1">작품명</label>
                                    <input 
                                        type="text" 
                                        placeholder="예: 이끼숲, 두 도시 이야기"
                                        value={form.title}
                                        onChange={e => setForm({...form, title: e.target.value})}
                                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm"
                                        required 
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-500 mb-1">캐스트/회차 정보</label>
                                    <input 
                                        type="text" 
                                        placeholder="예: 캐스트A"
                                        value={form.cast}
                                        onChange={e => setForm({...form, cast: e.target.value})}
                                        className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm"
                                    />
                                </div>
                                <div className="flex items-center gap-2 pt-1">
                                    <input 
                                        type="checkbox" 
                                        id="isDouble"
                                        checked={form.isDouble}
                                        onChange={e => setForm({...form, isDouble: e.target.checked})}
                                        className="w-4 h-4 text-indigo-600 rounded border-slate-300"
                                    />
                                    <label htmlFor="isDouble" className="text-sm text-slate-700 cursor-pointer">더블 적립 회차 (도장 2개)</label>
                                </div>
                                <button type="submit" className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition">
                                    기록 추가 및 최적화 재계산
                                </button>
                            </form>
                        </div>

                        {/* 분석 및 최적화 루트 결과 대시보드 */}
                        <div className="md:col-span-2 space-y-6">
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                <h2 className="text-lg font-semibold mb-4 text-slate-700">⚡ 작품별 최적화 및 도장 루트 분석</h2>
                                
                                {optimizedRoutes.length === 0 ? (
                                    <p className="text-sm text-slate-400 text-center py-6">입력된 기록이 없습니다.</p>
                                ) : (
                                    <div className="space-y-4">
                                        {optimizedRoutes.map((route, idx) => (
                                            <div key={idx} className="p-4 bg-slate-50 rounded-xl border border-slate-200/60 space-y-3">
                                                <div className="flex justify-between items-center">
                                                    <span className="font-bold text-base text-slate-800">{route.title}</span>
                                                    <span className="text-xs bg-indigo-100 text-indigo-700 font-semibold px-2.5 py-1 rounded-full">
                                                        적립 효율: {route.efficiency} (총 관람 {route.totalViews회}, 도장 {route.totalStamps}개)
                                                    </span>
                                                </div>

                                                {/* 진행도 바 */}
                                                <div>
                                                    <div className="flex justify-between text-xs text-slate-500 mb-1">
                                                        <span>다음 목표 루트</span>
                                                        <span className="font-medium text-slate-700">{route.nextMilestone}</span>
                                                    </div>
                                                    <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                                        <div className="bg-indigo-600 h-full transition-all duration-500" style={{ width: `${route.progressPercent}%` }}></div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* 전체 관극 기록 리스트 */}
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                <h2 className="text-lg font-semibold mb-4 text-slate-700">📋 입력된 전체 관극 기록</h2>
                                {records.length === 0 ? (
                                    <p className="text-sm text-slate-400 text-center py-4">기록이 없습니다.</p>
                                ) : (
                                    <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                                        {records.map(record => (
                                            <div key={record.id} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-sm border border-slate-100">
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <span className="font-bold text-slate-800">{record.title}</span>
                                                        <span className="text-xs text-slate-400">{record.date}</span>
                                                        {record.isDouble && <span className="bg-amber-100 text-amber-700 text-[10px] px-1.5 py-0.5 rounded font-semibold">더블적립</span>}
                                                    </div>
                                                    {record.cast && <span className="text-xs text-slate-500">{record.cast}</span>}
                                                </div>
                                                <button onClick={() => handleDelete(record.id)} className="text-slate-400 hover:text-rose-500 text-xs px-2 py-1">
                                                    삭제
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
