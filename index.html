<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뮤지컬 관극 도장판 최적화 탐색기</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 sm:p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="text-center">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">🧭 관극 도장판 최적 배분 & 최적화 탐색기</h1>
            <p class="text-slate-500 mt-1 text-sm">기준 개수에 도달하면 곧바로 다음 판으로 순환하여 채워나가는 시뮬레이션입니다.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- [왼쪽] 설정 및 기록 입력 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 md:col-span-1 space-y-5">
                <div>
                    <h2 class="text-md font-semibold mb-3 text-slate-700">⚙️ 도장판 맞춤 설정</h2>
                    <div class="space-y-3 text-sm">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">도장판 1판의 총 칸 수 (4 ~ 8칸)</label>
                            <select id="board-capacity" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg">
                                <option value="4">4칸 도장판</option>
                                <option value="5">5칸 도장판</option>
                                <option value="6">6칸 도장판</option>
                                <option value="7">7칸 도장판</option>
                                <option value="8" selected>8칸 도장판</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">판 넘김 기준 도장 수 (3 ~ 8개)</label>
                            <select id="target-criteria" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg">
                                <option value="3">3개 채우면 다음 판으로 넘김</option>
                                <option value="4">4개 채우면 다음 판으로 넘김</option>
                                <option value="5" selected>5개 채우면 다음 판으로 넘김</option>
                                <option value="6">6개 채우면 다음 판으로 넘김</option>
                                <option value="7">7개 채우면 다음 판으로 넘김</option>
                                <option value="8">8개 채우면 다음 판으로 넘김</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">운영할 도장판 총 개수</label>
                            <input type="number" id="board-count" value="4" min="1" max="10" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                        </div>
                        <button onclick="runOptimization()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition shadow-sm mt-2">
                            ⚡ 최적화 탐색 실행하기
                        </button>
                    </div>
                </div>

                <hr class="border-slate-100" />

                <div>
                    <h2 class="text-md font-semibold mb-3 text-slate-700">➕ 관극 기록 추가하기</h2>
                    <form onsubmit="addRecord(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">관람일자</label>
                            <input type="date" id="input-date" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm" required />
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">적립 배수</label>
                            <select id="input-earn-type" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
                                <option value="1">일반 적립 (도장 1개)</option>
                                <option value="2">더블 적립 (도장 2개)</option>
                                <option value="3">트리플 적립 (도장 3개)</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-medium rounded-lg text-sm transition">
                            기록 누적 저장
                        </button>
                    </form>
                </div>
            </div>

            <!-- [오른쪽] 탐색 결과 및 도장판 시각화 -->
            <div class="md:col-span-2 space-y-6">
                <!-- 결과 가이드 -->
                <div class="bg-indigo-50 border border-indigo-100 p-5 rounded-2xl space-y-2">
                    <h3 class="text-sm font-bold text-indigo-900 uppercase tracking-wider">💡 최적화 탐색 결과</h3>
                    <p id="advice-text" class="text-sm text-indigo-950 font-medium leading-relaxed pt-1">
                        왼쪽에서 관극 기록을 추가한 뒤 **[최적화 탐색 실행하기]** 버튼을 눌러주세요.
                    </p>
                </div>

                <!-- 도장판 시각화 영역 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                    <h3 class="text-md font-semibold text-slate-700">🎟️ 도장판별 순환 배분 현황</h3>
                    <div id="boards-container" class="space-y-4">
                        <p class="text-sm text-slate-400 text-center py-4">최적화 실행 전입니다.</p>
                    </div>
                </div>

                <!-- 관극 기록 리스트 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="text-md font-semibold mb-4 text-slate-700">📜 누적된 전체 관극 기록</h3>
                    <div id="timeline-list" class="space-y-2 max-h-52 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem('clean_opt_records_v7')) || [];
        let optimizedResult = null;

        document.getElementById('input-date').value = new Date().toISOString().split('T')[0];

        function addRecord(e) {
            e.preventDefault();
            const date = document.getElementById('input-date').value;
            const earnType = parseInt(document.getElementById('input-earn-type').value);

            const newRecord = { id: Date.now(), date, earnType };
            records.unshift(newRecord);
            localStorage.setItem('clean_opt_records_v7', JSON.stringify(records));
            render();
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            localStorage.setItem('clean_opt_records_v7', JSON.stringify(records));
            optimizedResult = null;
            render();
        }

        function runOptimization() {
            const boardCapacity = parseInt(document.getElementById('board-capacity').value);
            const targetCriteria = parseInt(document.getElementById('target-criteria').value);
            const totalBoards = parseInt(document.getElementById('board-count').value);

            let totalStampsEarned = 0;
            records.forEach(r => {
                totalStampsEarned += r.earnType;
            });

            let boards = {};
            for (let i = 1; i <= totalBoards; i++) {
                boards[i] = { boardNum: i, stampsCount: 0, completed: false };
            }

            let currentBoardIdx = 1;
            let stampsAllocated = 0;

            // 수정된 핵심 로직: 
            // 도장을 채우다가 '기준 도장 수(targetCriteria)'에 도달하면 곧바로 판을 완성(completed = true)하고 다음 판으로 넘어갑니다.
            while (stampsAllocated < totalStampsEarned && currentBoardIdx <= totalBoards) {
                boards[currentBoardIdx].stampsCount += 1;
                stampsAllocated += 1;

                // 설정한 기준 개수에 도달하는 순간 곧바로 마감하고 다음 판으로 점프
                if (boards[currentBoardIdx].stampsCount === targetCriteria) {
                    boards[currentBoardIdx].completed = true;
                    if (currentBoardIdx < totalBoards) {
                        currentBoardIdx += 1;
                    }
                }
            }

            // 마지막 판 처리
            if (boards[currentBoardIdx] && boards[currentBoardIdx].stampsCount >= targetCriteria) {
                boards[currentBoardIdx].completed = true;
            }

            optimizedResult = { boardCapacity, targetCriteria, totalBoards, boards, totalStampsEarned };
            renderResults();
        }

        function render() {
            let timelineHtml = '';
            if (records.length === 0) {
                timelineHtml = '<p class="text-sm text-slate-400 text-center py-4">누적된 관극 기록이 없습니다.</p>';
            } else {
                records.forEach((item, index) => {
                    let badge = '';
                    if (item.earnType === 2) badge = '<span class="ml-2 bg-amber-100 text-amber-700 text-[10px] px-1.5 py-0.5 rounded font-semibold">더블적립(+2)</span>';
                    if (item.earnType === 3) badge = '<span class="ml-2 bg-purple-100 text-purple-700 text-[10px] px-1.5 py-0.5 rounded font-semibold">트리플적립(+3)</span>';

                    timelineHtml += `
                        <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-sm border border-slate-100">
                            <div class="flex items-center gap-3">
                                <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center">${index + 1}</span>
                                <div>
                                    <span class="font-bold text-slate-800">${item.date} 관람</span>
                                    ${badge}
                                </div>
                            </div>
                            <button onclick="deleteRecord(${item.id})" class="text-slate-400 hover:text-rose-500 text-xs px-2 py-1">삭제</button>
                        </div>
                    `;
                });
            }
            document.getElementById('timeline-list').innerHTML = timelineHtml;

            if (optimizedResult) {
                renderResults();
            }
        }

        function renderResults() {
            if (!optimizedResult) return;
            const { boardCapacity, targetCriteria, totalBoards, boards, totalStampsEarned } = optimizedResult;
            let completedCount = Object.values(boards).filter(b => b.completed).length;

            document.getElementById('advice-text').innerHTML = `
                ✨ 최적화 탐색 완료! 총 누적 도장 **${totalStampsEarned}개**를 [${boardCapacity}칸 판 / ${targetCriteria}개 기준]으로 배분하여 **${completedCount}개의 판이 완성**되었습니다.
            `;

            let boardsHtml = '';
            for (let i = 1; i <= totalBoards; i++) {
                const b = boards[i];
                let gridHtml = '';
                
                // 도장판의 물리적 총 칸 수는 boardCapacity 만큼 그리되,
                // targetCriteria 까지만 도장을 채우고, 그 뒤의 칸들(기준점 초과 칸)은 비워둡니다.
                for (let slot = 1; slot <= boardCapacity; slot++) {
                    const isFilled = slot <= b.stampsCount;
                    const isBeyondCriteria = slot > targetCriteria;

                    let slotBg = '';
                    let label = `${slot}`;

                    if (isFilled) {
                        slotBg = 'bg-indigo-600 text-white shadow-sm';
                    } else if (isBeyondCriteria) {
                        slotBg = 'bg-slate-200 text-slate-300 opacity-45'; // 기준점 이후의 빈 칸은 흐리게 표시
                    } else {
                        slotBg = 'bg-slate-50 text-slate-300 border border-dashed border-slate-200';
                    }

                    gridHtml += `
                        <div class="aspect-square rounded-xl flex flex-col items-center justify-center text-xs font-bold transition-all relative ${slotBg}">
                            <span>${label}</span>
                            ${slot === targetCriteria ? '<span class="text-[8px] bg-indigo-500 text-white px-1 rounded mt-0.5">기준점</span>' : ''}
                        </div>
                    `;
                }

                boardsHtml += `
                    <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 space-y-3">
                        <div class="flex justify-between items-center text-sm">
                            <span class="font-bold text-slate-800">제 ${b.boardNum}판 (${boardCapacity}칸 판 / 목표 기준: ${targetCriteria}개 도달 시 마감)</span>
                            <span class="px-2.5 py-1 rounded-lg text-xs font-medium ${b.completed ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                ${b.completed ? '기준 달성 완료 ✨' : `진행 중 (${b.stampsCount}/${targetCriteria})`}
                            </span>
                        </div>
                        <div class="grid grid-cols-4 sm:grid-cols-8 gap-2">
                            ${gridHtml}
                        </div>
                    </div>
                `;
            }
            document.getElementById('boards-container').innerHTML = boardsHtml;
        }

        render();
    </script>
</body>
</html>
