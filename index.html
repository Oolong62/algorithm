<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뮤지컬 관극 도장판 최적화 탐색기</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 sm:p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="text-center">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">🧭 관극 도장판 최적화 배분 & 탐색기</h1>
            <p class="text-slate-500 mt-1 text-sm">판 개수와 목표 기준(4개/6개/8개)을 설정하면, 관극 기록을 바탕으로 가장 효율적인 도장 배분 순서를 탐색합니다.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- [왼쪽] 설정 및 기록 입력 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 md:col-span-1 space-y-5">
                <div>
                    <h2 class="text-md font-semibold mb-3 text-slate-700">⚙️ 최적화 설정</h2>
                    <div class="space-y-3 text-sm">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">목표 혜택 기준 도장 수</label>
                            <select id="target-criteria" onchange="updateSettings()" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg">
                                <option value="4">4개 기준 (우선 달성)</option>
                                <option value="6">6개 기준 (우선 달성)</option>
                                <option value="8">8개 기준 (우선 달성)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">운영할 도장판 총 개수</label>
                            <input type="number" id="board-count" value="2" min="1" max="10" onchange="updateSettings()" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg" />
                        </div>
                    </div>
                </div>

                <hr class="border-slate-100" />

                <div>
                    <h2 class="text-md font-semibold mb-3 text-slate-700">➕ 관극 기록 추가</h2>
                    <form onsubmit="addRecord(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">관람일자</label>
                            <input type="date" id="input-date" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm" required />
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">뮤지컬 작품명</label>
                            <input type="text" id="input-title" value="이끼숲" placeholder="예: 이끼숲" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm" required />
                        </div>
                        <div class="flex items-center gap-2 pt-1">
                            <input type="checkbox" id="input-double" class="w-4 h-4 text-indigo-600 rounded border-slate-300" />
                            <label for="input-double" class="text-xs text-slate-700 cursor-pointer">더블 적립 회차 (도장 2개)</label>
                        </div>
                        <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm transition">
                            기록 추가 및 최적 경로 탐색
                        </button>
                    </form>
                </div>
            </div>

            <!-- [오른쪽] 최적화 탐색 결과 및 판별 배분 시각화 -->
            <div class="md:col-span-2 space-y-6">
                <!-- 최적화 결과 가이드 -->
                <div class="bg-indigo-50 border border-indigo-100 p-5 rounded-2xl space-y-2">
                    <div class="flex justify-between items-center">
                        <h3 class="text-sm font-bold text-indigo-900 uppercase tracking-wider">💡 최적 배분 탐색 결과</h3>
                        <select id="show-select" onchange="changeShow(this.value)" class="p-1 bg-white border border-indigo-200 rounded-lg text-xs font-medium text-indigo-800">
                        </select>
                    </div>
                    <p id="advice-text" class="text-sm text-indigo-950 font-medium leading-relaxed pt-1"></p>
                </div>

                <!-- 설정된 판 개수만큼 도장판 시각화 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                    <h3 class="text-md font-semibold text-slate-700">🎟️ 도장판별 최적 배분 현황</h3>
                    <div id="boards-container" class="space-y-4"></div>
                </div>

                <!-- 관극 기록 리스트 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="text-md font-semibold mb-4 text-slate-700">📜 전체 관극 회차 타임라인</h3>
                    <div id="timeline-list" class="space-y-2 max-h-52 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem('optimized_boards_records')) || [
            { id: 1, date: '2026-03-01', title: '이끼숲', isDouble: false },
            { id: 2, date: '2026-03-10', title: '이끼숲', isDouble: true },
            { id: 3, date: '2026-03-15', title: '이끼숲', isDouble: false },
            { id: 4, date: '2026-03-20', title: '이끼숲', isDouble: false }
        ];

        let targetCriteria = 4; // 기준 도장 수 (4, 6, 8)
        let totalBoards = 2;    // 총 운영할 판 개수
        let activeShow = '이끼숲';

        document.getElementById('input-date').value = new Date().toISOString().split('T')[0];

        function updateSettings() {
            targetCriteria = parseInt(document.getElementById('target-criteria').value);
            totalBoards = parseInt(document.getElementById('board-count').value);
            render();
        }

        function addRecord(e) {
            e.preventDefault();
            const date = document.getElementById('input-date').value;
            const title = document.getElementById('input-title').value.trim();
            const isDouble = document.getElementById('input-double').checked;

            if (!title) return;

            const newRecord = { id: Date.now(), date, title, isDouble };
            records.unshift(newRecord);
            activeShow = title;
            render();
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            render();
        }

        function changeShow(val) {
            activeShow = val;
            render();
        }

        function render() {
            localStorage.setItem('optimized_boards_records', JSON.stringify(records));

            const shows = [...new Set(records.map(r => r.title))];
            const selectEl = document.getElementById('show-select');
            
            if (shows.length === 0) {
                selectEl.innerHTML = '<option>기록 없음</option>';
            } else {
                if (!shows.includes(activeShow)) activeShow = shows[0];
                selectEl.innerHTML = shows.map(s => `<option value="${s}" ${s === activeShow ? 'selected' : ''}>${s}</option>`).join('');
            }

            const showRecords = records
                .filter(r => r.title === activeShow)
                .sort((a, b) => new Date(a.date) - new Date(b.date));

            // 최적화 배분 알고리즘:
            // 설정된 판 개수(totalBoards)와 기준 도장 수(targetCriteria)에 맞춰 
            // 관극 기록에서 얻은 도장들을 순서대로 판에 최적 배분합니다.
            let boards = {};
            for (let i = 1; i <= totalBoards; i++) {
                boards[i] = { boardNum: i, stamps: [], completed: false };
            }

            let currentBoardIdx = 1;
            let totalStampsEarned = 0;
            let timelineMapping = [];

            showRecords.forEach((record, index) => {
                const earned = record.isDouble ? 2 : 1;
                let recordAllocations = [];

                for (let i = 0; i < earned; i++) {
                    totalStampsEarned += 1;
                    if (currentBoardIdx <= totalBoards) {
                        if (boards[currentBoardIdx].stamps.length < targetCriteria) {
                            boards[currentBoardIdx].stamps.push({ recordId: record.id, date: record.date });
                        }
                        // 만약 현재 판이 기준 개수(targetCriteria)를 채웠다면 다음 판으로 배분 준비
                        if (boards[currentBoardIdx].stamps.length === targetCriteria) {
                            boards[currentBoardIdx].completed = true;
                            if (currentBoardIdx < totalBoards) {
                                currentBoardIdx += 1;
                            }
                        }
                    }
                }

                timelineMapping.push({
                    id: record.id,
                    index: index + 1,
                    date: record.date,
                    isDouble: record.isDouble,
                    earned: earned
                });
            });

            // 조언 텍스트 생성
            let completedBoardsCount = Object.values(boards).filter(b => b.completed).length;
            let advice = `🎯 설정된 [${targetCriteria}개 기준]으로 총 ${totalBoards}개의 판 중 현재 **${completedBoardsCount}개 판이 완성**되었습니다. (총 누적 도장: ${totalStampsEarned}개)`;
            document.getElementById('advice-text').innerHTML = advice;

            // 판별 시각화 렌더링
            let boardsHtml = '';
            for (let i = 1; i <= totalBoards; i++) {
                const b = boards[i];
                let gridHtml = '';
                for (let slot = 1; slot <= targetCriteria; slot++) {
                    const isFilled = slot <= b.stamps.length;
                    gridHtml += `
                        <div class="aspect-square rounded-xl flex flex-col items-center justify-center text-xs font-bold transition-all relative ${isFilled ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-300 border border-dashed border-slate-200'}">
                            <span>${slot}</span>
                        </div>
                    `;
                }

                boardsHtml += `
                    <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 space-y-3">
                        <div class="flex justify-between items-center text-sm">
                            <span class="font-bold text-slate-800">제 ${b.boardNum}판 (${targetCriteria}개 만원)</span>
                            <span class="px-2.5 py-1 rounded-lg text-xs font-medium ${b.completed ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                                ${b.completed ? '목표 달성 완료 ✨' : `진행 중 (${b.stamps.length}/${targetCriteria})`}
                            </span>
                        </div>
                        <div class="grid grid-cols-4 sm:grid-cols-8 gap-2">
                            ${gridHtml}
                        </div>
                    </div>
                `;
            }
            document.getElementById('boards-container').innerHTML = boardsHtml;

            // 타임라인 렌더링
            let timelineHtml = '';
            if (timelineMapping.length === 0) {
                timelineHtml = '<p class="text-sm text-slate-400 text-center py-4">관극 기록이 없습니다.</p>';
            } else {
                [...timelineMapping].reverse().forEach(item => {
                    timelineHtml += `
                        <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl text-sm border border-slate-100">
                            <div class="flex items-center gap-3">
                                <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center">${item.index}</span>
                                <div>
                                    <span class="font-bold text-slate-800">${item.date} 관람</span>
                                    ${item.isDouble ? '<span class="ml-2 bg-amber-100 text-amber-700 text-[10px] px-1.5 py-0.5 rounded font-semibold">더블적립(+2)</span>' : ''}
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-medium text-slate-500">도장 +${item.earned}개 획득</span>
                                <button onclick="deleteRecord(${item.id})" class="text-slate-400 hover:text-rose-500 text-xs px-2 py-1">삭제</button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('timeline-list').innerHTML = timelineHtml;
        }

        render();
    </script>
</body>
</html>
